<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aponte a câmera</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/app.css?v=3">
</head>
<body>
<div class="bg-fx"></div>
<div class="scanline"></div>

<main class="qr-stage">
  <div class="qr-inner">
    <span class="eyebrow"><i class="dot"></i><span id="eventLabel">Evento</span></span>

    <h1 class="qr-titulo">
      Aponte a câmera<br><span class="gradient-text" id="qrChamada">e vamos nos conectar</span>
    </h1>

    <div class="qr-holder"><canvas id="qrCanvas"></canvas></div>

    <p class="qr-sub" id="qrSub">Abre um pré-cadastro de 30 segundos. Sem app, sem cadastro chato.</p>
    <p class="qr-url" id="qrUrl"></p>

    <div class="qr-acoes">
      <button type="button" class="btn btn--ghost" id="btnVoltar">Voltar</button>
      <button type="button" class="btn btn--ghost" id="btnCompartilhar">Compartilhar link</button>
    </div>
  </div>
</main>

<script src="/assets/qrcode.js?v=3"></script>
<script src="/assets/qr-draw.js?v=3"></script>
<script src="/assets/perfil.js?v=3"></script>
<script src="/assets/qr-view.js?v=3"></script>
</body>
</html>
